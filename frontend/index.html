<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameVault - Cadastro de Jogos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-glow"></div>

    <div class="container">
        <header>
            <h1 class="logo">Cadastro<span>Jogos</span></h1>
            <p class="subtitle">Gerenciador do Acervo de Jogos</p>
        </header>

        <section class="card form-card">
            <h2 id="formTitle">🎮 Cadastrar Novo Jogo</h2>
            
            <form id="formJogo">
                <input type="hidden" id="jogoId">

                <div class="form-grid">
                    <div class="form-group">
                        <label for="titulo">Título do Jogo</label>
                        <input type="text" id="titulo" placeholder="Ex: Minecraft" required>
                    </div>

                    <div class="form-group">
                        <label for="genero">Gênero</label>
                        <select id="genero" required>
                            <option value="SANDBOX">Sandbox</option>
                            <option value="RPG">RPG</option>
                            <option value="FPS">FPS</option>
                            <option value="PUZZLE">Puzzle</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="horas">Horas Jogadas</label>
                        <input type="number" id="horas" min="0" placeholder="0" required>
                    </div>

                    <div class="form-group checkbox-group">
                        <label class="switch">
                            <input type="checkbox" id="multiplayer">
                            <span class="slider"></span>
                        </label>
                        <span class="checkbox-label">Possui Modo Multijogador</span>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" id="btnSalvar" class="btn btn-primary">
                        <span class="btn-text">Salvar Jogo</span>
                    </button>
                    <button type="button" id="btnCancelar" class="btn btn-secondary hidden" onclick="cancelarEdicao()">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="card table-card">
            <h2>🕹️ Jogos Cadastrados</h2>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Título</th>
                            <th>Gênero</th>
                            <th>Horas</th>
                            <th>Multiplayer</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaJogos">
                        <!-- Dados injetados pelo JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>

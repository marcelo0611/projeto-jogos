<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Gerenciamento de Jogos</h1>
        
        <form id="form-jogo">
            <input type="hidden" id="jogo-id">
            
            <div class="form-group">
                <label for="titulo">Título do Jogo:</label>
                <input type="text" id="titulo" required>
            </div>
            
            <div class="form-group">
                <label for="genero">Gênero:</label>
                <select id="genero" required>
                    <option value="SANDBOX">Sandbox</option>
                    <option value="RPG">RPG</option>
                    <option value="FPS">FPS</option>
                    <option value="PUZZLE">Puzzle</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="horas">Horas Jogadas:</label>
                <input type="number" id="horas" min="0" required>
            </div>
            
            <div class="form-group checkbox-group">
                <input type="checkbox" id="multijogador">
                <label for="multijogador">Possui modo multijogador?</label>
            </div>
            
            <button type="submit" id="btn-salvar">Salvar Jogo</button>
            <button type="button" id="btn-cancelar" style="display:none;" onclick="resetarFormulario()">Cancelar Edição</button>
        </form>

        <hr>

        <h2>Lista de Jogos</h2>
        <table id="tabela-jogos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Gênero</th>
                    <th>Horas</th>
                    <th>Multijogador</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
